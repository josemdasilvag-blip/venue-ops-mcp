[project]
name = "venue-ops-mcp"
version = "0.1.0"
description = "MCP server exposing multi-site venue operations data: sales, covers, the control block and labour."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "pydantic>=2.6"]

[project.scripts]
venue-ops-mcp = "venue_ops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venue_ops_mcp"]
